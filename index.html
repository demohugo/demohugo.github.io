<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio – Illustrations</title>
<style>
  :root {
    --bg: #f6f3f0;
    --text: #28221e;
    --muted: #8b7f75;
    --border: #e2d6cf;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: radial-gradient(circle at top left, #fffaf6 0, #f6f3f0 50%, #efeae4 100%);
    color: var(--text);
  }
  img { max-width: 100%; display: block; border-radius: 18px; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }
  .container { width: 100%; max-width: 1500px; margin: 0 auto; padding: 1.2rem 1.2rem 2.4rem; }

  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
    background: linear-gradient(to bottom, rgba(246,243,240,0.97), rgba(246,243,240,0.7));
    border-bottom: 1px solid rgba(226,214,207,0.7);
  }
  .header-inner {
    max-width: 1180px; margin: 0 auto; padding: 0.7rem 1.6rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  nav { display: flex; gap: 1.1rem; font-size: 0.78rem; color: var(--muted); }
  nav a { text-decoration: none; color: inherit; }

  section { padding: 1.8rem 0; }

  /* ONGLETS */
  .tabs {
    position: fixed;
    top: 3.6rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    background: rgba(246, 243, 240, 0.4);
    backdrop-filter: blur(10px);
    padding: 0.5rem 1rem;
    border-radius: 999px;
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  .tabs.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .tab-btn {
    font-size: 0.78rem;
    letter-spacing: 0.19em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0.4rem 0.2rem;
    cursor: pointer;
    font-weight: 600;
    transition: color 0.3s ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom: 1px solid var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .tab-panel { padding-top: 3.6rem; }

  /* GALERIE */
  .illu-flow { display: flex; flex-direction: column; }
  .illu-row { display: flex; justify-content: center; margin-bottom: -7vh; width: 100%; }
  .illu-row.align-left { justify-content: flex-start; }
  .illu-row.align-right { justify-content: flex-end; }
  @media (max-width: 1020px) {
    .illu-row { justify-content: center; margin-bottom: 6vh; }
  }
  .illu-row-inner { width: 30vw; max-width: 680px; }
  @media (max-width: 840px) { .illu-row-inner { width: 85vw; } }

  .illu-image {
    opacity: 0.55; filter: blur(3px); transform: scale(0.98);
    transition: opacity 0.9s ease-out, filter 1.1s cubic-bezier(0.16, 0.67, 0.43, 0.99),
      transform 1.1s cubic-bezier(0.16, 0.67, 0.43, 0.99);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.07);
  }
  .illu-image.focus {
    opacity: 1; filter: blur(0px); transform: scale(1);
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
  }

  /* ANIMATION (vidéos façon galerie) */
  .video-flow { display: flex; flex-direction: column; gap: 1.4rem; }

  .video-row-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.2rem;
  }
  @media (max-width: 900px) {
    .video-row-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .video-row-4 { grid-template-columns: 1fr; }
  }

  .video-row-1 { display: flex; justify-content: center; }
  .video-row-1 .video-item { width: 100%; max-width: 1100px; }

  .video-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 18px;
    opacity: 0.55; filter: blur(3px); transform: scale(0.98);
    transition: opacity 0.9s ease-out, filter 1.1s cubic-bezier(0.16, 0.67, 0.43, 0.99),
      transform 1.1s cubic-bezier(0.16, 0.67, 0.43, 0.99);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.07);
  }
  .video-item.rectangular { aspect-ratio: 16 / 9; }
  .video-item.focus {
    opacity: 1; filter: blur(0px); transform: scale(1);
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
  }
  .video-item video, .video-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #111;
  }

  .section-title {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.19em;
    color: var(--muted); margin-bottom: 1.4rem; text-align: center;
  }

  #contact { margin-top: 14vh; }

  footer { padding: 1.6rem 1.6rem 2rem; font-size: 0.76rem; color: var(--muted); text-align: center; }

  .modal {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: none; align-items: center; justify-content: center; z-index: 15;
    backdrop-filter: blur(14px);
  }
  .modal.open { display: flex; }
  .modal img, .modal video {
    max-width: 90vw; max-height: 90vh; border-radius: 16px;
    box-shadow: 0 34px 60px rgba(0, 0, 0, 0.3);
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-inner">
      <div class="logo">HUGO</div>
      <nav>
        <a href="#galerie" data-tab-link="galerie">Galerie</a>
        <a href="#animation" data-tab-link="animation">Animation</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="tabs">
      <button class="tab-btn active" data-tab="galerie">Galerie</button>
      <button class="tab-btn" data-tab="animation">Animation</button>
    </div>

    <!-- ONGLET GALERIE -->
    <section id="galerie" class="tab-panel active">
      <div class="illu-flow">
        <!-- IMAGES EXISTANTES -->
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0675.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0674.png"/></div></div></div>
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0677.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0679.png"/></div></div></div>
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0683.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0681.png"/></div></div></div>
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0676.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0684.png"/></div></div></div>
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0685.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0686.jpg"/></div></div></div>
        <!-- NOUVELLES IMAGES -->
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0695.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0699.png"/></div></div></div>
        <div class="illu-row align-left"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0700.png"/></div></div></div>
        <div class="illu-row align-right"><div class="illu-row-inner"><div class="illu-image"><img src="IMG_0721.png"/></div></div></div>
      </div>
    </section>

    <!-- ONGLET ANIMATION -->
    <section id="animation" class="tab-panel">
      <div class="video-flow">
        <div class="video-row-4">
          <div class="video-item"><video src="Elle_le_sait_4.mp4" muted loop autoplay playsinline></video></div>
          <div class="video-item"><video src="AnneesLumieres2.mp4" muted loop autoplay playsinline></video></div>
          <div class="video-item"><video src="gimmecover2.mp4" muted loop autoplay playsinline></video></div>
          <div class="video-item"><img src="image0.gif" alt="Animation 4"/></div>
        </div>
        <div class="video-row-1">
          <div class="video-item rectangular"><video src="ANIM_sonplusfort.mp4" muted loop autoplay playsinline></video></div>
        </div>
      </div>
    </section>

    <section id="contact">
      <div class="section-title">Contact</div>
      <div style="text-align:center; font-size:0.9rem; color:var(--muted);">
        Pour une commande, une affiche ou une collaboration : 2almeidahugo@gmail.com
      </div>
    </section>

  </main>

  <footer>
    © <span id="year"></span> Hugo — Illustration.
  </footer>
</div>

<div class="modal" id="modal">
  <img id="modal-img" style="display:none;"/>
</div>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  // --- Gestion des onglets ---
  const tabBtns = document.querySelectorAll(".tab-btn");
  const tabPanels = document.querySelectorAll(".tab-panel");

  function activateTab(tabName) {
    tabBtns.forEach(b => b.classList.toggle("active", b.dataset.tab === tabName));
    tabPanels.forEach(p => p.classList.toggle("active", p.id === tabName));
    window.scrollTo(0, 0);
  }

  tabBtns.forEach(btn => {
    btn.addEventListener("click", () => activateTab(btn.dataset.tab));
  });

  document.querySelectorAll("[data-tab-link]").forEach(link => {
    link.addEventListener("click", (e) => {
      const target = link.dataset.tabLink;
      if (target === "galerie" || target === "animation") {
        e.preventDefault();
        activateTab(target);
      }
    });
  });

  // --- Effet de mise au point (scroll) sur la galerie ET les vidéos ---
  const images = document.querySelectorAll(".illu-image");
  const videoItems = document.querySelectorAll(".video-item");
  const focusTargets = [...images, ...videoItems];

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach(entry => {
        if (entry.intersectionRatio > 0.55) {
          entry.target.classList.add("focus");
        } else {
          entry.target.classList.remove("focus");
        }
      });
    },
    { threshold: [0,0.2,0.4,0.55,0.7,1] }
  );
  focusTargets.forEach(el => observer.observe(el));

  // --- Masquer l'overlay des onglets lors du clic sur un fichier (image/vidéo) ---
  const tabsOverlay = document.querySelector(".tabs");
  function hideTabsOverlay() { tabsOverlay.classList.add("hidden"); }
  function showTabsOverlay() { tabsOverlay.classList.remove("hidden"); }

  // --- Vidéos : lecture en boucle façon gif, contrôles visibles seulement au survol ---
  videoItems.forEach(item => {
    item.addEventListener("click", hideTabsOverlay);
    const video = item.querySelector("video");
    if (!video) return; // le 4e slot est un gif (img), pas de contrôles nécessaires
    video.play().catch(() => {});
    item.addEventListener("mouseenter", () => { video.controls = true; });
    item.addEventListener("mouseleave", () => { video.controls = false; showTabsOverlay(); });
  });

  // --- Modale (galerie uniquement) ---
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modal-img");

  images.forEach(img => {
    img.addEventListener("click", () => {
      modalImg.src = img.querySelector("img").src;
      modalImg.style.display = "block";
      modal.classList.add("open");
      hideTabsOverlay();
    });
  });

  modal.addEventListener("click", () => {
    modal.classList.remove("open");
    showTabsOverlay();
  });
</script>
</body>
</html>
